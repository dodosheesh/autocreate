[project]
name = "autocreate"
version = "0.1.0"
description = "Content factory - moteur de génération de Reels IA en masse (Seedance via kie.ai)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "boto3>=1.35",
    "httpx>=0.27",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]
# QC face-match (lourd : modèles ONNX téléchargés au premier run)
qc = [
    "insightface>=0.7",
    "onnxruntime>=1.19",
    "opencv-python-headless>=4.10",
]

[tool.setuptools]
packages = { find = { include = ["app*"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
