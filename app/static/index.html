<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>autocreate — content factory</title>
<style>
  :root {
    --bg: #0e0f13; --panel: #16181f; --panel2: #1d2029; --border: #2a2e3a;
    --text: #e8eaf0; --muted: #8b90a0; --accent: #7c5cff; --accent2: #4ecdc4;
    --ok: #3ecf8e; --warn: #f0a832; --err: #ef5b5b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 system-ui, -apple-system, sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin-bottom: 24px; font-size: 13px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--muted); margin: 0 0 14px; }
  .grid { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--border);
          border-radius: 12px; padding: 18px; margin-bottom: 20px; }
  label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  select, input[type=text], input[type=number], input[type=url] {
    width: 100%; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    font-size: 14px; outline: none; }
  select:focus, input:focus { border-color: var(--accent); }
  .cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 640px) { .cats { grid-template-columns: repeat(2, 1fr); } }
  .cat { background: var(--panel2); border: 1px solid var(--border);
         border-radius: 10px; padding: 10px; text-align: center; }
  .cat b { display: block; font-size: 12px; margin-bottom: 6px; font-weight: 600; }
  .cat input { text-align: center; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .seg { display: flex; background: var(--panel2); border: 1px solid var(--border);
         border-radius: 8px; overflow: hidden; }
  .seg button { flex: 1; background: none; border: 0; color: var(--muted);
                padding: 8px 4px; cursor: pointer; font-size: 13px; }
  .seg button.on { background: var(--accent); color: #fff; }
  .estimate { position: sticky; top: 16px; }
  .big { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
  .big small { font-size: 13px; color: var(--muted); font-weight: 400; }
  .est-line { display: flex; justify-content: space-between; padding: 5px 0;
              border-bottom: 1px dashed var(--border); font-size: 13px; }
  .est-line:last-child { border-bottom: 0; }
  .est-line .v { font-variant-numeric: tabular-nums; }
  .warn-box { background: rgba(240,168,50,.12); border: 1px solid var(--warn);
              color: var(--warn); border-radius: 8px; padding: 8px 10px;
              font-size: 12px; margin-top: 10px; display: none; }
  .btn { display: inline-block; background: var(--accent); color: #fff; border: 0;
         border-radius: 10px; padding: 12px 18px; font-size: 15px; font-weight: 600;
         cursor: pointer; width: 100%; margin-top: 14px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.small { width: auto; padding: 6px 12px; font-size: 12px; margin: 0; }
  .btn.ghost { background: var(--panel2); border: 1px solid var(--border); color: var(--text); }
  .btn.ok { background: var(--ok); } .btn.bad { background: var(--err); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px;
       padding: 6px 8px; border-bottom: 1px solid var(--border); }
  td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr.job-row { cursor: pointer; } tr.job-row:hover td { background: var(--panel2); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px;
           font-size: 11px; font-weight: 600; }
  .b-completed, .b-done, .b-approved, .b-pass { background: rgba(62,207,142,.15); color: var(--ok); }
  .b-failed, .b-rejected, .b-fail, .b-blocked_budget { background: rgba(239,91,91,.15); color: var(--err); }
  .b-pending, .b-composed, .b-composing, .b-skipped { background: rgba(139,144,160,.15); color: var(--muted); }
  .b-dispatched, .b-generated, .b-qc, .b-voiced, .b-assembled { background: rgba(124,92,255,.15); color: var(--accent); }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
           gap: 12px; margin-top: 12px; }
  .item { background: var(--panel2); border: 1px solid var(--border);
          border-radius: 10px; padding: 10px; }
  .item video { width: 100%; border-radius: 8px; background: #000; aspect-ratio: 9/16;
                max-height: 300px; }
  .item .prompt { color: var(--muted); font-size: 11px; max-height: 48px;
                  overflow: hidden; margin: 6px 0; }
  .item .actions { display: flex; gap: 6px; margin-top: 6px; }
  .muted { color: var(--muted); } .mono { font-variant-numeric: tabular-nums; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
           background: var(--panel2); border: 1px solid var(--accent); border-radius: 10px;
           padding: 10px 18px; display: none; z-index: 10; }
</style>
</head>
<body>
<div class="wrap">
  <h1>auto<span>create</span></h1>
  <div class="sub">content factory — Seedance via kie.ai · voice-swap ElevenLabs · assemblage FFmpeg</div>

  <div class="grid">
    <div>
      <div class="card">
        <h2>Panneau de génération</h2>
        <label>Model</label>
        <select id="model"></select>

        <div style="margin-top:14px">
          <label>Vidéos par catégorie</label>
          <div class="cats" id="cats"></div>
        </div>

        <div class="row">
          <div><label>Résolution</label>
            <div class="seg" data-name="resolution">
              <button data-v="480p">480p</button>
              <button data-v="720p" class="on">720p</button>
              <button data-v="1080p">1080p</button>
            </div>
          </div>
          <div><label>Bitrate</label>
            <div class="seg" data-name="bitrate">
              <button data-v="standard" class="on">standard</button>
              <button data-v="high">high</button>
            </div>
          </div>
        </div>
        <div class="row">
          <div><label>Durée : <b id="durv">10</b> s</label>
            <input type="range" id="duration" min="3" max="30" value="10" style="width:100%">
          </div>
          <div><label>Variante de modèle</label>
            <select id="variant"><option value="seedance_2.0">seedance_2.0</option></select>
          </div>
        </div>
        <div class="row">
          <div><label>Budget max (USD, optionnel)</label>
            <input type="number" id="budget" min="0" step="1" placeholder="—"></div>
          <div><label>Musique (URL, optionnel)</label>
            <input type="url" id="music" placeholder="https://…"></div>
        </div>
        <button class="btn" id="generate">⚡ Generate</button>
      </div>

      <div class="card">
        <h2>Jobs</h2>
        <table>
          <thead><tr><th>créé</th><th>catégories</th><th>statut</th>
                     <th>estimé</th><th>réel</th></tr></thead>
          <tbody id="jobs"></tbody>
        </table>
        <div id="job-detail"></div>
      </div>
    </div>

    <div class="card estimate">
      <h2>Coût estimé</h2>
      <div class="big" id="est-eff">$0.00 <small>effectif (livré)</small></div>
      <div style="margin-top:10px">
        <div class="est-line"><span class="muted">Brut</span><span class="v" id="est-gross">$0.00</span></div>
        <div class="est-line"><span class="muted">Vidéos</span><span class="v" id="est-count">0</span></div>
        <div class="est-line"><span class="muted">$ / vidéo livrée</span><span class="v" id="est-per">$0.00</span></div>
        <div class="est-line"><span class="muted">Taux QC calibré</span><span class="v" id="est-qc">—</span></div>
        <div id="est-cats"></div>
      </div>
      <div class="warn-box" id="budget-warn"></div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const CATEGORIES = ["skit","storytelling","showing_body","micro_trottoir","podcast","snapchat"];
const $ = (s) => document.querySelector(s);
const state = { resolution: "720p", bitrate: "standard" };

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  setTimeout(() => t.style.display = "none", 3500);
}
async function api(path, opts) {
  const r = await fetch("/api" + path, Object.assign({headers: {"Content-Type": "application/json"}}, opts));
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

// --- panneau ---
$("#cats").innerHTML = CATEGORIES.map(c =>
  `<div class="cat"><b>${c}</b><input type="number" min="0" value="0" data-cat="${c}"></div>`).join("");

document.querySelectorAll(".seg").forEach(seg => {
  seg.addEventListener("click", (e) => {
    if (e.target.tagName !== "BUTTON") return;
    seg.querySelectorAll("button").forEach(b => b.classList.remove("on"));
    e.target.classList.add("on");
    state[seg.dataset.name] = e.target.dataset.v;
    refreshEstimate();
  });
});
$("#duration").addEventListener("input", () => { $("#durv").textContent = $("#duration").value; refreshEstimate(); });
["#budget", "#variant"].forEach(s => $(s).addEventListener("input", refreshEstimate));
$("#cats").addEventListener("input", refreshEstimate);

function counts() {
  const out = {};
  document.querySelectorAll("[data-cat]").forEach(i => {
    const n = parseInt(i.value || "0", 10);
    if (n > 0) out[i.dataset.cat] = n;
  });
  return out;
}

let estTimer = null;
function refreshEstimate() { clearTimeout(estTimer); estTimer = setTimeout(doEstimate, 250); }
async function doEstimate() {
  const c = counts();
  const warn = $("#budget-warn"); warn.style.display = "none";
  if (!Object.keys(c).length) {
    $("#est-eff").innerHTML = '$0.00 <small>effectif (livré)</small>';
    ["#est-gross","#est-per"].forEach(s => $(s).textContent = "$0.00");
    $("#est-count").textContent = "0"; $("#est-cats").innerHTML = ""; return;
  }
  try {
    const body = { counts_per_category: c, duration_s: +$("#duration").value,
                   resolution: state.resolution, model_variant: $("#variant").value };
    const budget = parseFloat($("#budget").value);
    if (!isNaN(budget)) body.budget_usd = budget;
    const e = await api("/estimate/batch", {method: "POST", body: JSON.stringify(body)});
    $("#est-eff").innerHTML = `$${e.effective_usd.toFixed(2)} <small>effectif (livré)</small>`;
    $("#est-gross").textContent = `$${e.gross_usd.toFixed(2)}`;
    $("#est-count").textContent = e.total_items;
    $("#est-per").textContent = `$${e.cost_per_delivered_video_usd.toFixed(3)}`;
    $("#est-qc").textContent = `${(e.qc_success_rate * 100).toFixed(0)} %`;
    $("#est-cats").innerHTML = Object.entries(e.per_category_usd).map(([k, v]) =>
      `<div class="est-line"><span class="muted">· ${k}</span><span class="v">$${v.toFixed(2)}</span></div>`).join("");
    if (e.over_budget) {
      warn.style.display = "block";
      warn.textContent = `⚠ Dépasse le budget — max ~${e.max_videos_for_budget} vidéos livrables à cette config.`;
    }
  } catch (err) { toast("Estimation : " + err.message); }
}

// --- models ---
async function loadModels() {
  const models = await api("/models");
  $("#model").innerHTML = models.length
    ? models.map(m => `<option value="${m.id}">${m.name}</option>`).join("")
    : '<option value="">— créer une model via POST /api/models —</option>';
}

// --- generate ---
$("#generate").addEventListener("click", async () => {
  const c = counts();
  if (!$("#model").value) return toast("Aucune model sélectionnée");
  if (!Object.keys(c).length) return toast("Aucune vidéo demandée");
  const body = { model_id: $("#model").value, counts_per_category: c,
                 resolution: state.resolution, bitrate: state.bitrate,
                 duration_s: +$("#duration").value, model_variant: $("#variant").value };
  const budget = parseFloat($("#budget").value);
  if (!isNaN(budget)) body.budget_cap_usd = budget;
  if ($("#music").value) body.music_url = $("#music").value;
  $("#generate").disabled = true;
  try {
    const job = await api("/jobs/batch", {method: "POST", body: JSON.stringify(body)});
    toast("Job lancé — composition en cours");
    await loadJobs(); await openJob(job.id);
  } catch (err) { toast("Generate : " + err.message); }
  $("#generate").disabled = false;
});

// --- jobs / review ---
const badge = (s) => `<span class="badge b-${s}">${s}</span>`;
let currentJob = null;

async function loadJobs() {
  const jobs = await api("/jobs");
  $("#jobs").innerHTML = jobs.map(j => `
    <tr class="job-row" onclick="openJob('${j.id}')">
      <td class="mono">${(j.created_at || "").toString().slice(0, 16).replace("T", " ")}</td>
      <td>${Object.entries(j.counts_per_category || {}).map(([k, v]) => `${k}:${v}`).join(" ")}</td>
      <td>${badge(j.status)}${Object.keys(j.compose_shortfall || {}).length ? " ⚠" : ""}</td>
      <td class="mono">${j.estimated_cost_usd != null ? "$" + j.estimated_cost_usd.toFixed(2) : "—"}</td>
      <td class="mono">${j.actual_cost_usd != null ? "$" + j.actual_cost_usd.toFixed(2) : "—"}</td>
    </tr>`).join("") || '<tr><td colspan="5" class="muted">aucun job</td></tr>';
}

async function openJob(id) {
  currentJob = id;
  const j = await api("/jobs/" + id);
  const shortfall = Object.keys(j.compose_shortfall || {}).length
    ? `<div class="warn-box" style="display:block">Combos épuisés : ${JSON.stringify(j.compose_shortfall)}</div>` : "";
  $("#job-detail").innerHTML = `
    <div style="margin-top:16px; display:flex; justify-content:space-between; align-items:center">
      <h2 style="margin:0">Job ${id.slice(0, 8)} ${badge(j.status)}</h2>
      <span><button class="btn small ghost" onclick="openJob('${id}')">↻</button>
      <button class="btn small" onclick="exportJob('${id}')">Exporter les approuvés</button></span>
    </div>${shortfall}
    <div class="items">${j.items.map(it => `
      <div class="item">
        ${it.final_video_url ? `<video src="${it.final_video_url}" controls preload="metadata"></video>` : ""}
        <div>${badge(it.status)} ${badge("qc: " + it.qc_status)} ${it.review_status !== "pending" ? badge(it.review_status) : ""}</div>
        <div class="prompt">${it.category} — ${(it.filled_prompt || "").slice(0, 140)}</div>
        ${it.error ? `<div class="prompt" style="color:var(--err)">${it.error.slice(0, 120)}</div>` : ""}
        ${it.status === "done" ? `<div class="actions">
          <button class="btn small ok" onclick="review('${it.id}','approved')">✓ Approve</button>
          <button class="btn small bad" onclick="review('${it.id}','rejected')">✗ Reject</button>
        </div>` : ""}
      </div>`).join("")}</div>`;
}

async function review(itemId, decision) {
  try { await api(`/items/${itemId}/review`, {method: "POST", body: JSON.stringify({decision})});
        if (currentJob) openJob(currentJob); }
  catch (err) { toast("Review : " + err.message); }
}

async function exportJob(id) {
  const e = await api(`/jobs/${id}/export`);
  if (!e.approved_count) return toast("Aucun item approuvé");
  const blob = new Blob([JSON.stringify(e, null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `export_${id.slice(0, 8)}.json`;
  a.click();
}

window.openJob = openJob; window.review = review; window.exportJob = exportJob;

loadModels().catch(e => toast(e.message));
loadJobs().catch(() => {});
setInterval(() => { loadJobs().catch(() => {}); if (currentJob) openJob(currentJob).catch(() => {}); }, 8000);
refreshEstimate();
</script>
</body>
</html>
