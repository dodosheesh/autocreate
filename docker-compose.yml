# Dev local uniquement : Postgres + Redis
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: autocreate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
